<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turing Tape - Quinten Yearsley</title>
    <meta
      name="description"
      content="Write rules for a Turing machine to transform tapes in this puzzle game"
    />
    <meta name="theme-color" content="#2d3748" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="styles/main.css" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script src="/shared/theme.js"></script>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- game.js rewrites the visible #level-title with the current level, so it
         cannot double as the page heading. Hidden because the top bar has no
         room for a second title. -->
    <h1 class="visually-hidden">Turing Tape</h1>

    <div class="game-layout">
      <div class="game-top-bar">
        <a href="/games/" class="icon-btn" id="back-link" aria-label="Back to games">&larr;</a>
        <span class="level-title" id="level-title">Turing Tape</span>
        <!-- Not a live region: Play advances the machine every 400ms for up to
             500 steps, so announcing the counter would drown out the result
             message. Same reasoning for #current-state below. -->
        <span class="step-display" id="step-display">Steps: <span id="step-count">0</span></span>
        <!-- Filled by build.js on the /zh/ pages; empty and invisible here. -->
        <div class="lang-slot"></div>
      </div>

      <main id="main-content" class="game-main">
        <!-- Level selector -->
        <div class="section-group">
          <h2 class="section-heading" id="puzzles-heading">Puzzles</h2>
          <nav id="level-nav" class="level-nav" aria-labelledby="puzzles-heading"></nav>
        </div>

        <!-- Level description -->
        <p id="level-description" class="level-description"></p>

        <div id="target-section" class="tape-section">
          <div class="tape-label">Goal</div>
          <div class="tape-scroll">
            <div id="target-tape" class="tape tape-target"></div>
          </div>
        </div>

        <!-- Active tape + head. The head indicator lives inside the scroll
             container so it tracks the cell it points at when the tape is
             wider than the screen. -->
        <div class="tape-section">
          <div class="tape-label">Tape</div>
          <div class="tape-scroll with-head">
            <div id="active-tape" class="tape tape-active"></div>
            <div id="head-indicator" class="head-indicator"></div>
          </div>
        </div>

        <!-- State + controls on one line -->
        <div class="controls-bar">
          <div class="status-line">State: <strong id="current-state">A</strong></div>
          <div class="controls">
            <button id="step-btn" class="ctrl-btn">
              <span class="btn-icon">&#x23ed;</span> Step <kbd>Space</kbd>
            </button>
            <button id="play-btn" class="ctrl-btn">
              <span class="btn-icon" id="play-icon">&#x25b6;</span>
              <span id="play-label">Play</span> <kbd>Enter</kbd>
            </button>
            <button id="reset-btn" class="ctrl-btn">
              <span class="btn-icon">&#x21ba;</span> Reset <kbd>R</kbd>
            </button>
          </div>
        </div>

        <!-- Result message. The one live region on the page: it changes only
             when the machine halts, so it never talks over itself. `role="status"`
             carries an implicit aria-live="polite", so that attribute is omitted.
             `.hidden` is `display: none`, so nothing is announced until a result
             is actually shown. -->
        <div id="result-msg" class="result-msg hidden" role="status"></div>

        <!-- Rule table -->
        <div class="rule-section">
          <div class="rule-header">
            <h2>Rules</h2>
            <button id="add-rule-btn" class="small-btn">+ Add Rule</button>
          </div>
          <div class="rule-table-scroll">
            <table id="rule-table" class="rule-table">
              <thead>
                <tr>
                  <th>State</th>
                  <th>Read</th>
                  <th>Write</th>
                  <th>Move</th>
                  <th>Next State</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="rule-body"></tbody>
            </table>
          </div>
        </div>

        <p class="info-section">
          A <a href="https://en.wikipedia.org/wiki/Turing_machine">Turing machine</a> follows rules
          to read and write symbols on a tape. Add rules so the tape matches the Goal, then press
          Step or Play.
        </p>
      </main>
    </div>

    <script src="/shared/nav.js"></script>
    <script type="module" src="js/main.js"></script>
    <script>
      if (window.__registerShortcut) {
        window.__registerShortcut("Space", "Step execution")
        window.__registerShortcut("Enter", "Play / pause")
        window.__registerShortcut("r", "Reset machine")
      }
    </script>
  </body>
</html>
